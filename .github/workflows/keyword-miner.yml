name: Keyword Miner

on:
  schedule:
    # 每1.5小时（90分钟）执行一次
    - cron: '*/90 * * * *'

  # 允许手动触发
  workflow_dispatch:

jobs:
  keyword-mining:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytrends requests pandas

      - name: Run keyword miner
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_COLORING_TOKEN: ${{ secrets.GIST_COLORING_TOKEN }}
        run: |
          python3 keyword_miner.py
