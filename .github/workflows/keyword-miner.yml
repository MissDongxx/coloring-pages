name: Keyword Miner

on:
  schedule:
    # 每1.5小时（90分钟）执行一次
    - cron: '*/90 * * * *'

  # 允许手动触发
  workflow_dispatch:

jobs:
  keyword-mining:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download keywords.csv from artifacts
        uses: actions/download-artifact@v4
        with:
          name: keywords-data-miner
          path: .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytrends requests pandas

      - name: Run keyword miner
        run: |
          python3 keyword_miner.py

      - name: Upload keywords.csv as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keywords-data-miner
          path: keywords.csv
          retention-days: 90
